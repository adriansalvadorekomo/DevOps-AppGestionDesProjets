# MySQL 8 as a StatefulSet: a stable identity (db-0) and its own volume from the
# claim template. The headless Service "db" governs it, so db:3306 resolves to the pod.
# The backend connects as the application user, never as root.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels: { app.kubernetes.io/name: db, app.kubernetes.io/part-of: gestion-projets }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: db }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels: { app.kubernetes.io/name: db, app.kubernetes.io/part-of: gestion-projets }
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: db, app.kubernetes.io/part-of: gestion-projets }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_DATABASE
              valueFrom: { configMapKeyRef: { name: app-config, key: MYSQL_DATABASE } }
            # The image creates this user with all privileges on MYSQL_DATABASE only.
            - name: MYSQL_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: mysql }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
