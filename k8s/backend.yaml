# Spring Boot API, two replicas. Probes use the actuator health groups, so a pod
# only receives traffic once its database connection works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: gestion-projets }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: gestion-projets }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: twelvy1400/gestion-projets-backend:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: MYSQL_DATABASE
              valueFrom: { configMapKeyRef: { name: app-config, key: MYSQL_DATABASE } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://db:3306/$(MYSQL_DATABASE)?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { configMapKeyRef: { name: app-config, key: MYSQL_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_PASSWORD } }
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36   # up to 3 minutes for the first start
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: gestion-projets }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
