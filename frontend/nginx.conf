server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # The API, same origin: /api/projet/all → http://backend:8080/projet/all.
  # "backend" is the compose service and the Kubernetes Service name.
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Angular SPA fallback: serve index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively (Angular outputHashing=all)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
