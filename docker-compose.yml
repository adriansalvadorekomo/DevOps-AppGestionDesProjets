# Full stack: Frontend (nginx) -> Backend (Spring Boot) -> Database (MySQL 8.0)
# + Code quality: SonarQube (lts-community) -> SonarDB (Postgres 15)
# Reproducible via: docker compose up -d --build  (Jenkins-ready, no secrets baked in)
# Override defaults with a local .env file (untracked) or environment variables.
# SonarQube needs Postgres: SonarQube 9.9+ dropped MySQL, so app-db (mysql:8.0)
# CANNOT be reused here. Host prereq: sysctl -w vm.max_map_count=262144 (~2GB RAM).

services:
  db:
    image: mysql:8.0
    container_name: app-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net
    # No published ports: DB is reachable internally as db:3306 only.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: app-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-test_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    ports:
      - "8080:8080"
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: app-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      # Host 4200 preserves README convention (localhost:4200); container serves on 80.
      # Browser calls backend via http://localhost:8080 (published above).
      - "4200:80"
    networks:
      - app-net
    restart: unless-stopped

  # JUNIOR: Why Postgres and not the existing MySQL db?
  # SonarQube 9.9+ supports ONLY Postgres ( + embedded H2 for demos).
  # MySQL/Oracle support was removed upstream, so sonardb is a DEDICATED
  # database for code-quality data only (issues, coverage, history).
  # Never point the app backend at sonardb, never point SonarQube at app-db.
  sonardb:
    image: postgres:15-alpine
    container_name: app-sonardb
    environment:
      POSTGRES_USER: ${SONAR_JDBC_USERNAME:-sonar}
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_JDBC_DATABASE:-sonar}
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    networks:
      - app-net
    # No published ports: reachable internally as sonardb:5432 only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # JUNIOR: What is this?
  # SonarQube = static-analysis server: scanners send sources + coverage,
  # server computes bugs/vulnerabilities/duplication/coverage, Quality Gate
  # says PASS/FAIL. UI at http://localhost:9000 (admin/admin on first boot).
  # Scanner -> http://sonarqube:9000 inside Compose; browser -> localhost:9000.
  sonarqube:
    image: sonarqube:lts-community
    container_name: app-sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/${SONAR_JDBC_DATABASE:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
      # Token is NEVER baked here: scanners pass SONAR_TOKEN at analysis time
      # (Jenkins credential `sonar-token`, see Jenkinsfile + SONARQ.md).
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - app-net
    healthcheck:
      # The image has no curl or wget: ask /api/system/status over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /api/system/status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── Monitoring · opt-in: docker compose --profile monitoring up -d ──────────
  # Prometheus scrapes the backend's /actuator/prometheus every 15 s and evaluates
  # monitoring/prometheus/alerts.yml; Alertmanager groups and routes what fires;
  # Grafana opens on the provisioned dashboard "Gestion des projets · backend".
  # All bound to 127.0.0.1.
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: app-prometheus
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app-net
    depends_on:
      - backend
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: app-alertmanager
    profiles: [monitoring]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - app-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    container_name: app-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only anonymous access to the dashboards (local use only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/backend.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  sonardb_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus_data:
  alertmanager_data:
  grafana_data:
