# Alert rules. Prometheus evaluates them every 15 s and sends firing alerts to
# Alertmanager (monitoring/alertmanager/alertmanager.yml), which routes them by severity.
groups:
  - name: backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The backend has not answered a scrape for 1 minute"

      - alert: BackendHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="backend"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

      - alert: BackendSlowP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="backend", uri!~"/actuator.*"}[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 500 ms"

      - alert: BackendHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{job="backend", area="heap"})
            / sum(jvm_memory_max_bytes{job="backend", area="heap"} > 0) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap above 90% for 10 minutes"
