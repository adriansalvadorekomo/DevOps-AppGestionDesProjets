# Alertmanager: groups, deduplicates, inhibits and routes the alerts Prometheus fires
# (monitoring/prometheus/alerts.yml). UI: http://127.0.0.1:9093
#
# Notification channels need secrets, so none is committed. To page someone, put the
# secret in a git-ignored file under monitoring/alertmanager/secrets/ and uncomment the
# matching block below, e.g. a Slack incoming webhook:
#   echo 'https://hooks.slack.com/services/...' > monitoring/alertmanager/secrets/slack_webhook_url
# Until then, alerts are grouped and visible in the UI and through amtool.
global:
  resolve_timeout: 5m

route:
  receiver: team
  group_by: [alertname, service]
  group_wait: 30s        # collect alerts that fire together into one notification
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The API is down: notify fast and repeat often.
    - matchers: [severity="critical"]
      receiver: on-call
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # While the backend is down, its error, latency and heap warnings are noise.
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [severity="warning"]
    equal: [service]

receivers:
  - name: on-call
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
