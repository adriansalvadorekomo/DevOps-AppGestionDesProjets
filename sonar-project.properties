# ============================================================================
# JUNIOR GUIDE: What is this file?
# ----------------------------------------------------------------------------
# SonarQube scanner configuration for the WHOLE repo (backend + frontend).
# The scanner reads this file and knows: which project, which folders are
# real code, what to ignore, where coverage reports live, which server.
#
# Flow: Jenkins stage 'SonarQube Analysis' -> sonar-scanner ->
#         http://sonarqube:9000 (or SONAR_HOST_URL) with SONAR_TOKEN
#         -> Quality Gate PASS/FAIL (see SONARQ.md).
#
# Run locally (SonarQube up first):
#   docker run --rm --network app-net -v "$PWD:/usr/src" \
#     -e SONAR_HOST_URL=http://sonarqube:9000 -e SONAR_TOKEN=$SONAR_TOKEN \
#     sonarsource/sonar-scanner-cli
# Secrets: NEVER write the token here. Pass via env SONAR_TOKEN only.
# ============================================================================

# Unique key in SonarQube (lowercase, no spaces). Shown in URL + Jenkins logs.
sonar.projectKey=devops-appgestiondesprojets
# Human name in SonarQube UI.
sonar.projectName=DevOps-AppGestionDesProjets
sonar.projectVersion=1.0.0

# Where the scanner runs: repo root. Sources = real code only.
sonar.sources=backend/src,frontend/src
# Tests (so SonarQube counts them separately, not as duplication).
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java,**/test/**

# What → Why → Misuse:
# node_modules/target/dist = generated, huge, not your code. Scanning them
# wastes minutes and creates false bugs. .angular = local cache. Never scan.
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/.angular/**,**/*.spec.ts
sonar.coverage.exclusions=**/main/java/tn/esprit/backend/BackendApplication.java,**/config/**,frontend/src/main.ts,frontend/src/**/*.spec.ts

sonar.sourceEncoding=UTF-8
sonar.language=java,ts

# ---- Backend (Java 17, Maven) ----
# Compiled classes needed for real Java rules (null-deref, injection, etc.).
# Without this: warning "Java analysis requires compiled classes".
sonar.java.binaries=backend/target/classes
sonar.java.source=17
# JaCoCo XML produced by `mvn verify` (see backend/pom.xml jacoco plugin).
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports

# ---- Frontend (Angular 22, TypeScript) ----
# LCOV produced by `npm run test -- --coverage` (vitest). If missing on the
# first run, scanner warns but still reports bugs/smells — coverage appears
# once tests run with coverage enabled.
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Duplication: 100 tokens minimum avoids flagging tiny getters/imports.
sonar.cpd.minimumTokens=100
